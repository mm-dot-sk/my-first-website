<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Hello and welcome to our restaurant MFOOD!</h1>
    <img src="rest-banner.jpg" alt="Restaurant Banner" width="600">
   <hr> <p>

 <!-- following dropdown for reservations -->
    <h3> table reservations</h3>
    <label for="guests">Choose number of guests for your reservation:</label>
    <select name="guests" id="guests">
        <option value="1">1 Person</option>
        <option value="2">2 People</option>
        <option value="3">3 People</option>
        <option value="4">4 People</option>
        <option value="5">5 People</option>
        <option value="6">6 People</option>
        <option value="7">7 People</option>
        <option value="8">8 People</option>
        <option value="9">9 People</option>
        <option value="10">10 People</option>
    </select>
    <label for="date">Choose a date for your reservation:</label>
    <input type="date" id="date" name="date">
    <button type="submit">Make Reservation</button>

</body>
